name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Cursor hook contract self-test
        # Required gate: real forwarder.sh → hook-receiver → cursor driver → derive.
        # No CURSOR_API_KEY needed; this is the spawn contract Cursor uses.
        run: npm run test:cursor-hooks

      - name: Build
        run: npm run build

  # Optional but real: install Cursor CLI and prove project .cursor/hooks.json
  # fires into our receiver. Skips cleanly when CURSOR_API_KEY is unset so forks
  # stay green; when the secret IS set, this job is a hard gate.
  # Docs: https://cursor.com/docs/cli/github-actions
  #       https://cursor.com/docs/hooks
  cursor-cli-hook-selftest:
    name: Cursor CLI hook self-test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect CURSOR_API_KEY
        id: creds
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CURSOR_API_KEY secret not set — skipping Cursor CLI hook self-test. Contract gate (test:cursor-hooks) still required."
          fi

      - name: Install Cursor CLI
        if: steps.creds.outputs.available == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor CLI → project hooks → receiver
        if: steps.creds.outputs.available == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SHADOW_HOOK_RECEIVER_PORT: '9477'
        run: scripts/hooks/ci-cursor-cli-self-test.sh
